# /etc/nginx/sites-available/el-kholasa.online
server {
    server_name el-kholasa.online www.el-kholasa.online;

    # Support large file uploads (PDF materials and images)
    client_max_body_size 100M;

    # Gzip Compression Optimization (70-80% smaller bundle downloads)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Immutable Cache for Next.js Static Chunks & Bundles (1 year)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3025;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Browser Cache for static media and assets
    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|woff|woff2)$ {
        proxy_pass http://127.0.0.1:3025;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3025;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/el-kholasa.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/el-kholasa.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.el-kholasa.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = el-kholasa.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name el-kholasa.online www.el-kholasa.online;
    return 404; # managed by Certbot
}

